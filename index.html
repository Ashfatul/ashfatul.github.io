<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ashfatul Islam ~ Launchpad & Portfolio Hub</title>
  <meta name="description" content="Welcome to the personal digital hub for Ashfatul Islam. Explore full portfolio, resume, GitHub, LinkedIn, and direct contact options." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="res/img/favicon.png" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Dynamic Ambient Background Lights -->
  <div class="bg-canvas">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <!-- App Viewport Container (100dvh Single Screen Lock) -->
  <main class="app-container">
    <div class="layout-wrapper">
      
      <!-- LEFT COLUMN: User Profile Info -->
      <aside class="profile-column">
        <!-- Status Badge -->
        <div id="status-badge" class="status-badge" style="display: none;"></div>
        
        <!-- Profile Avatar -->
        <div id="avatar-container" class="avatar-wrapper" style="display: none;"></div>
        
        <!-- User Info Typography -->
        <h1 id="user-name" class="user-name"></h1>
        <p id="user-title" class="user-title"></p>
        <p id="user-bio" class="user-bio"></p>

        <!-- Location Pill -->
        <div id="location-pill" class="location-pill" style="display: none;"></div>
      </aside>

      <!-- RIGHT COLUMN: Action Links Hub -->
      <section class="links-column">
        <!-- Optional Auto Redirect Countdown -->
        <div id="auto-redirect-container" style="display: none;"></div>

        <!-- Primary Featured Destination (Main Portfolio Hero Card) -->
        <div id="featured-container" style="display: none;"></div>

        <!-- Secondary Action Link Cards -->
        <nav id="action-cards-list" class="action-cards-list" aria-label="Quick links"></nav>

        <!-- Footer -->
        <footer id="hub-footer" class="hub-footer"></footer>
      </section>

    </div>
  </main>

  <!-- Toast Notification Popup -->
  <div id="toast" class="toast-msg" role="status" aria-live="polite"></div>

  <!-- Configuration & Application Logic -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
